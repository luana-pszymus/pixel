<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <title>Polímnia | Consultor de Pixel Art</title>

    <style>
      body {
        background-color: #f2d6b3;
        color: #8c1f33;
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 40px;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 900px;
        background: #ffffff;
        padding: 35px;
        border-radius: 15px;
        border: 2px solid #f28585;
        box-shadow: 0 10px 30px rgba(140, 31, 51, 0.15);
      }

      header {
        border-bottom: 3px solid #8c1f33;
        margin-bottom: 25px;
        padding-bottom: 10px;
      }

      h1 {
        margin: 0;
      }

      .instrucao {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        display: block;
      }

      textarea,
      input {
        width: 100%;
        padding: 15px;
        border-radius: 8px;
        border: 2px solid #f2daac;
        background-color: #fffaf5;
        font-size: 16px;
        outline: none;
        box-sizing: border-box;
      }

      textarea {
        height: 120px;
        resize: none;
      }

      #secao-ajustes {
        display: none;
        margin-top: 15px;
        padding: 20px;
        background: #fafafa;
        border-radius: 10px;
        border: 1px dashed #8c1f33;
      }

      .grid-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 10px;
      }

      .btn-toggle {
        background: none;
        border: none;
        color: #d95276;
        cursor: pointer;
        text-decoration: underline;
        padding: 10px 0;
        font-weight: bold;
      }

      .btn-gerar {
        width: 100%;
        background: #8c1f33;
        color: white;
        border: none;
        padding: 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 18px;
        margin-top: 15px;
      }

      .btn-gerar:hover {
        background: #d95276;
      }

      #resultado {
        margin-top: 30px;
        padding: 25px;
        background: #f2daac;
        color: #000000;
        border-radius: 8px;

        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-x: auto;

        font-family: "Courier New", monospace;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>PROJETO POLÍMNIA</h1>

        <p style="color: #d95276; font-weight: bold">
          Ana Vitória e Luana Gabrielly
        </p>
      </header>

      <label class="instrucao"> O que você quer criar? </label>

      <textarea
        id="pergunta"
        placeholder="Ex: Um coração de cristal ou uma espada de fogo..."
      ></textarea>

      <button class="btn-toggle" onclick="toggleAjustes()">
        + Ajustes avançados (opcional)
      </button>

      <div id="secao-ajustes">
        <div class="grid-inputs">
          <div>
            <label>Tamanho:</label>

            <input type="text" id="tamanho" placeholder="Ex: 16x16" />
          </div>

          <div>
            <label>Paleta HEX:</label>

            <input type="text" id="paleta" placeholder="#FF0000, #00FF00" />
          </div>
        </div>

        <div style="margin-top: 15px">
          <label>Função das cores:</label>

          <input
            type="text"
            id="significado"
            placeholder="Ex: vermelho = fogo"
          />
        </div>
      </div>

      <button class="btn-gerar" onclick="gerar()">CRIAR PIXEL ART</button>

      <div id="resultado"></div>
    </div>

    <script>
      function toggleAjustes() {
        const s = document.getElementById("secao-ajustes");

        s.style.display = s.style.display === "block" ? "none" : "block";
      }

      const textarea = document.getElementById("pergunta");

      textarea.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();

          gerar();
        }
      });

      async function gerar() {
        const box = document.getElementById("resultado");

        const pergunta = document.getElementById("pergunta").value;

        if (!pergunta) {
          alert("Dê uma ideia para a Polímnia!");

          return;
        }

        box.style.display = "block";

        box.innerText = "Polímnia está criando sua pixel art...";

        try {
          const res = await fetch("/perguntar", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              pergunta: pergunta,

              tamanho: document.getElementById("tamanho").value,

              paleta: document.getElementById("paleta").value,

              significado: document.getElementById("significado").value,
            }),
          });

          const data = await res.json();

          box.innerText = data.resposta || "Erro ao gerar.";

          // LIMPA O CAMPO
          document.getElementById("pergunta").value = "";
        } catch (e) {
          box.innerText = "Erro na conexão.";
        }
      }
    </script>
  </body>
</html>
